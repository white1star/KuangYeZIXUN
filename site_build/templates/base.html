<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}矿业资讯站{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23289048'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="site-head">
  <div class="head-inner container">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-text"><b>像素智能</b><small>矿业资讯站</small></span>
    </a>
    <div class="head-right">
      <nav class="site-nav">
        <a href="index.html" class="{{ 'active' if page == 'index' else '' }}">首页</a>
        <a href="news.html" class="{{ 'active' if page == 'news' else '' }}">新闻</a>
        <a href="prices.html" class="{{ 'active' if page == 'prices' else '' }}">矿价</a>
        <a href="policy.html" class="{{ 'active' if page == 'policy' else '' }}">政策</a>
        <a href="copy.html" class="{{ 'active' if page == 'copy' else '' }}">文案</a>
      </nav>
      <a class="portal-back" href="/">← 信息中心</a>
    </div>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-foot">
  <div class="foot-inner container">
    <span>仅存标题与摘要 · 点击标题跳转原文 · 构建于 {{ build_time }}</span>
    <span>© 2026 像素智能</span>
  </div>
</footer>
{% if feedback_email %}
<button class="feedback-fab" id="feedback-open" type="button" aria-haspopup="dialog">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span>反馈</span>
</button>
<dialog class="fb-dialog" id="feedback-dialog">
  <form id="feedback-form">
    <h3>意见反馈</h3>
    <label>怎么称呼你（可选）
      <input name="name" maxlength="30" autocomplete="off">
    </label>
    <label>说点什么……
      <textarea name="message" required maxlength="500"></textarea>
    </label>
    <div class="fb-row">
      <span class="fb-count" id="fb-count">0/500</span>
      <button type="button" class="fb-cancel" id="fb-cancel">取消</button>
      <button type="submit" class="fb-submit" id="fb-submit">提交</button>
    </div>
    <p class="fb-msg" id="fb-msg" hidden></p>
  </form>
</dialog>
<script>
(function () {
  var open = document.getElementById('feedback-open');
  var dialog = document.getElementById('feedback-dialog');
  var form = document.getElementById('feedback-form');
  var msg = document.getElementById('fb-msg');
  var counter = document.getElementById('fb-count');
  var submit = document.getElementById('fb-submit');
  var cancel = document.getElementById('fb-cancel');
  var message = form.elements.message;
  message.addEventListener('input', function () {
    counter.textContent = message.value.length + '/500';
  });
  open.addEventListener('click', function () { dialog.showModal(); });
  cancel.addEventListener('click', function () { dialog.close(); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submit.disabled = true;
    msg.hidden = true;
    var payload = {
      _subject: '矿业资讯站反馈',
      _template: 'table',
      _captcha: 'false',
      '称呼': (form.elements.name.value || '').trim() || '（未填）',
      '反馈内容': form.elements.message.value,
      '页面': location.href
    };
    fetch('https://formsubmit.co/ajax/' + atob('{{ feedback_email_b64 }}'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data && String(data.success) === 'true') {
        msg.textContent = '已收到，谢谢！';
        msg.className = 'fb-msg';
        msg.hidden = false;
        setTimeout(function () {
          dialog.close();
          form.reset();
          counter.textContent = '0/500';
          msg.hidden = true;
        }, 1500);
      } else {
        throw new Error('fail');
      }
    }).catch(function () {
      msg.textContent = '提交失败，请稍后再试';
      msg.className = 'fb-msg err';
      msg.hidden = false;
    }).finally(function () {
      submit.disabled = false;
    });
  });
})();
</script>
{% else %}
<a class="feedback-fab" id="feedback-open" href="#" rel="nofollow">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span>反馈</span>
</a>
<script>
(function () {
  var user = '3103631561';
  var domain = 'qq' + '.com';
  var open = document.getElementById('feedback-open');
  function link() {
    var subject = '矿业资讯站反馈';
    var body = '页面地址：' + location.href + '\n\n反馈内容：\n';
    return 'mailto:' + user + '@' + domain + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }
  function sync() { open.setAttribute('href', link()); }
  sync();
  open.addEventListener('click', sync);
})();
</script>
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
