{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}政策法规 · 矿业资讯站{% endblock %}
{% block content %}
<section class="page-body">
  <div class="container">
    <h1 class="page-title">政策法规</h1>
    <p class="page-sub">汇聚矿产行业最新政策、法规及通知公告</p>

    <div class="card toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input id="pq" type="search" autocomplete="off" spellcheck="false"
               aria-label="用一句话查政策，如：最近山西的煤矿探矿权政策">
      </div>
      <span class="ptype" id="result-count"></span>
      <div id="active-filters" class="chips"></div>
    </div>

    <div class="card answer-card" id="answer" hidden></div>

    <div class="card feed-card" id="feed">
      {% for a in articles %}{{ ui.entry(a) }}{% endfor %}
    </div>
    <p class="empty" id="feed-empty" hidden>没有匹配的政策，换个说法试试</p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="app.js"></script>
<script>
(function () {
  var qEl = document.getElementById('pq');
  var countEl = document.getElementById('result-count');
  var chipsEl = document.getElementById('active-filters');
  var answerEl = document.getElementById('answer');
  var feedEl = document.getElementById('feed');
  var emptyEl = document.getElementById('feed-empty');
  var feed = new App.Feed(feedEl, 50);
  var all = [];
  var asked = false;

  function setCount(n, hint) {
    if (countEl) countEl.textContent = '共 ' + n + ' 条' + (hint ? '（' + hint + '）' : '');
  }

  var STOP = {'最近': 1, '近期': 1, '最新': 1, '的': 1, '了': 1, '吗': 1, '呢': 1,
              '有': 1, '哪些': 1, '什么': 1, '方面': 1, '关于': 1, '怎么': 1,
              '如何': 1, '政策': 1, '法规': 1, '通知': 1, '公告': 1};

  function localFilter(query) {
    var tokens = String(query || '').trim().toLowerCase().split(/\s+/)
      .filter(function (t) { return t.length > 1 && !STOP[t]; });
    if (!tokens.length) return all;
    return all.filter(function (a) {
      var hay = [a.title, a.summary, a.source_name,
                 (a.minerals || []).join(' '), (a.regions || []).join(' '),
                 (a.types || []).join(' ')].join(' ').toLowerCase();
      return tokens.every(function (t) { return hay.indexOf(t) >= 0; });
    });
  }

  function showItems(items, query, hint) {
    feedEl.hidden = items.length === 0;
    emptyEl.hidden = items.length > 0;
    setCount(items.length, hint);
    feed.set(items, query);
  }

  function renderChips(intent) {
    if (!chipsEl) return;
    if (!intent) { chipsEl.innerHTML = ''; return; }
    var parts = [
      ['地区', intent.regions], ['矿种', intent.minerals],
      ['类型', intent.types], ['机关', intent.source ? [intent.source] : []],
      ['关键词', intent.keywords]
    ];
    var html = '';
    parts.forEach(function (pair) {
      var list = pair[1] || [];
      list.forEach(function (v) {
        html += '<span class="chip-filter">' + App.esc(pair[0]) + ' ' + App.esc(v) + '</span>';
      });
    });
    chipsEl.innerHTML = html;
  }

  function renderAnswer(card) {
    if (!answerEl || !card) return;
    var note = card.note ? '<div class="ans-note">' + App.esc(card.note) + '</div>' : '';
    answerEl.innerHTML =
      '<div class="ans-head"><span class="ans-title">' + App.esc(card.title || '') + '</span>' +
      '<span class="ans-actions"><button type="button" class="ans-btn" data-act="close">收起</button></span></div>' +
      '<div class="ans-body">' + note +
      '<div class="ans-value">' + App.esc(card.value || '') + '</div>' +
      (card.meta ? '<div class="ans-meta">' + App.esc(card.meta) + '</div>' : '') +
      '</div>';
    answerEl.hidden = false;
    answerEl.querySelector('[data-act="close"]').addEventListener('click', function () {
      answerEl.hidden = true;
    });
  }

  function hideAnswer() {
    if (answerEl) answerEl.hidden = true;
  }

  // 打字：本地即时过滤（不等模型）
  var timer = null;
  qEl.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var q = qEl.value;
      if (!q.trim()) {
        hideAnswer();
        renderChips(null);
        showItems(all, '', '');
        return;
      }
      showItems(localFilter(q), q, '关键词匹配，按回车用 AI 解读');
    }, 120);
  });

  // 回车：交给 /api/ask 理解意图（地区/矿种/类型/时间）
  qEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      qEl.value = '';
      hideAnswer();
      renderChips(null);
      showItems(all, '', '');
      return;
    }
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var q = qEl.value.trim();
    if (!q) return;
    setCount(localFilter(q).length, '正在让 AI 理解…');
    fetch('api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, history: []})
    }).then(function (resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }).then(function (data) {
      var intent = data.intent || {};
      if (!data.ok || intent.action !== 'policy') {
        showItems(localFilter(q), q, '关键词匹配');
        renderChips(null);
        renderAnswer({title: q, value: '', meta: '这句没听成政策查询，先按关键词给你结果；可以问「最近山西的煤矿探矿权政策」'});
        return;
      }
      asked = true;
      renderChips(intent);
      renderAnswer(data.card || {});
      showItems(data.items || [], q, 'AI 解读');
    }).catch(function () {
      showItems(localFilter(q), q, '关键词匹配');
      renderChips(null);
    });
  });

  App.loadJSON('policy.json').then(function (payload) {
    all = payload.items || [];
    var params = new URLSearchParams(location.search);
    var q = params.get('q') || '';
    if (q) {
      qEl.value = q;
      showItems(localFilter(q), q, '关键词匹配');
    } else {
      showItems(all, '', '');
    }
  }).catch(function () {
    emptyEl.hidden = false;
  });
})();
</script>
{% endblock %}
