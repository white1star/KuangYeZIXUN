# 选矿热榜配置：加/减关键词、改来源权重都只改这里，不改代码。
enabled: true
max_age_days: 7          # 社媒/资讯只收最近 7 天
wechat_max_age_days: 730 # 微信搜狗结果偏旧，保留两年内的技术热文
cleanup_days: 30         # 数据库里超过 30 天的热榜记录自动清理
request_timeout: 20
request_interval: 1.5

