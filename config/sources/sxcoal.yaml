key: sxcoal
name: 中国煤炭资源网
board: price
parser: regex
url: https://www.sxcoal.com/
price_type: 指数
unit: 元/吨
regex:
  pattern: "(?P<name>(?:[^\\s]{1,12} )?CCI[^\\s]{0,12}?指数)\\s+(?P<date>\\d{4}/\\d{1,2}/\\d{1,2})\\s+(?P<price>\\d{3,6}(?:\\.\\d+)?)"
# 指数名里带地区/口径限定词：CCI进口3800=进口煤，山西低硫焦煤=产地，吕梁准一级=产地+焦级
market_map:
  进口: 进口
  吕梁: 吕梁
  山西: 山西
  山东: 山东
  陕西: 陕西
  贵州: 贵州
  内蒙: 内蒙
covered_commodities: [动力煤, 焦煤, 焦炭]
commodity_map:
  焦煤: [主焦煤, 柳林, 气煤, 肥煤, 焦煤]
  焦炭: [焦炭]
  动力煤: ["5500", "5000", "4500", 动力煤]
