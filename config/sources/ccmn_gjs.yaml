key: ccmn_gjs
name: 长江有色·贵金属
board: price
parser: ccmn_quota
url: https://mall.ccmn.cn/shop/quotaData/getQuotaData
referer: https://www.ccmn.cn/priceinfo/gjs
method: POST
post_data:
  colName: gjs
  pageNo: 1
  pageSize: 50
headers:
  X-Requested-With: XMLHttpRequest
price_type: 现货
exact_match: true
basis: 含税
unit: 元/吨
items: quotaVoList
quote:
  name: productSortName
  price: avgPrice
  date: publishDateTime
  market: marketName
  origin: placeOrTrademark
  spec: trademark
  unit: unit
covered_commodities: [黄金, 白银, 铂金, 钯金]
commodity_map:
  黄金: ["黄金", "99黄金", "95黄金", "现货黄金"]
  白银: ["1#白银", "2#白银", "3#白银"]
  铂金: ["铂金"]
  钯金: ["钯金"]
