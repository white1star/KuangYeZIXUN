key: ccmn_xjs
name: 长江有色·小金属
board: price
parser: ccmn_quota
url: https://mall.ccmn.cn/shop/quotaData/getQuotaData
referer: https://www.ccmn.cn/priceinfo/xjs
method: POST
post_data:
  colName: xjs
  pageNo: 1
  pageSize: 50
headers:
  X-Requested-With: XMLHttpRequest
price_type: 现货
exact_match: true
basis: 含税
unit: 元/吨
items: quotaVoList
quote:
  name: productSortName
  price: avgPrice
  date: publishDateTime
  market: marketName
  origin: placeOrTrademark
  spec: trademark
  unit: unit
covered_commodities: [金属硅, 镁, 铟, 碲, 钴, 锑, 电解锰, 铋]
commodity_map:
  金属硅: ["441#硅", "金属硅3303#-2202#", "3303#硅", "2202#硅（福建）", "2202#硅",
          "2502#硅（福建）", "421#硅（福建）", "金属硅553#-331#", "1501#硅（福建）"]
  镁: ["1#镁"]
  铟: ["铟"]
  碲: ["碲"]
  钴: ["1#钴"]
  锑: ["1#锑"]
  电解锰: ["1#电解锰(99.7%袋装)", "电解锰(99.7%袋装)"]
  铋: ["1#铋"]
