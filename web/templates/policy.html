{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}政策法规 · 矿业资讯站{% endblock %}
{% block content %}
<section class="page-body">
  <div class="container">
    <h1 class="page-title">政策法规</h1>
    <p class="page-sub">汇聚矿产行业最新政策、法规及通知公告</p>
    <div class="card filter-card">
      <form class="filterbar" method="get" action="/policy">
        <select name="source">
          <option value="">全部机关</option>
          {% for s in sources %}<option value="{{ s.key }}" {{ 'selected' if s.key == source else '' }}>{{ s.name }}</option>{% endfor %}
        </select>
        <input name="region" value="{{ region }}" placeholder="地区，如 河北">
        <button class="btn-primary" type="submit">筛选</button>
      </form>
    </div>
    <div class="card feed-card">
      {% for a in articles %}{{ ui.entry(a) }}{% else %}
      <p class="empty">没有符合条件的政策，试试其他机关或地区</p>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
