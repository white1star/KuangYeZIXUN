<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}矿业资讯站{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
{% set path = request.url.path %}
<header class="site-head">
  <div class="head-inner container">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-text"><b>像素智能</b><small>矿业资讯站</small></span>
    </a>
    <nav class="site-nav">
      <a href="/" class="{{ 'active' if path == '/' else '' }}">首页</a>
      <a href="/news" class="{{ 'active' if path.startswith('/news') else '' }}">新闻</a>
      <a href="/prices" class="{{ 'active' if path.startswith('/prices') else '' }}">矿价</a>
      <a href="/policy" class="{{ 'active' if path.startswith('/policy') else '' }}">政策</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-foot">
  <div class="foot-inner container">
    <span>仅存标题与摘要 · 点击标题跳转原文</span>
    <span>© 2026 像素智能 <a href="/sources">数据源状态</a></span>
  </div>
</footer>
</body>
</html>
