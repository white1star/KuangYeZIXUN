<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}矿业资讯站{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
{% set path = request.url.path %}
<header class="site-head">
  <div class="head-inner container">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-text"><b>像素智能</b><small>矿业资讯站</small></span>
    </a>
    <nav class="site-nav">
      <a href="/" class="{{ 'active' if path == '/' else '' }}">首页</a>
      <a href="/news" class="{{ 'active' if path.startswith('/news') else '' }}">新闻</a>
      <a href="/prices" class="{{ 'active' if path.startswith('/prices') else '' }}">矿价</a>
      <a href="/policy" class="{{ 'active' if path.startswith('/policy') else '' }}">政策</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-foot">
  <div class="foot-inner container">
    <span>仅存标题与摘要 · 点击标题跳转原文</span>
    <span>© 2026 像素智能 <a href="/sources">数据源状态</a></span>
  </div>
</footer>
<button class="feedback-fab" type="button" id="feedback-open" aria-haspopup="dialog">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span>反馈</span>
</button>
<dialog class="feedback-dialog" id="feedback-dialog" aria-labelledby="feedback-title">
  <form id="feedback-form" method="dialog">
    <h2 class="fb-title" id="feedback-title">意见反馈</h2>
    <input class="fb-input" id="feedback-contact" type="text" maxlength="50" placeholder="怎么称呼你（可选）" autocomplete="off">
    <textarea class="fb-textarea" id="feedback-content" maxlength="500" placeholder="说点什么……" aria-label="反馈内容" required></textarea>
    <div class="fb-foot">
      <span class="fb-count" id="feedback-count">0/500</span>
      <div class="fb-actions">
        <button class="fb-cancel" type="button" id="feedback-cancel">取消</button>
        <button class="btn-primary" type="submit" id="feedback-submit">提交</button>
      </div>
    </div>
    <p class="fb-msg" id="feedback-msg" role="alert"></p>
  </form>
</dialog>
<script>
(function () {
  var dialog = document.getElementById('feedback-dialog');
  var openBtn = document.getElementById('feedback-open');
  var form = document.getElementById('feedback-form');
  var contact = document.getElementById('feedback-contact');
  var content = document.getElementById('feedback-content');
  var count = document.getElementById('feedback-count');
  var submitBtn = document.getElementById('feedback-submit');
  var cancelBtn = document.getElementById('feedback-cancel');
  var msg = document.getElementById('feedback-msg');
  var closeTimer = null;

  openBtn.addEventListener('click', function () {
    msg.textContent = '';
    msg.className = 'fb-msg';
    dialog.showModal();
    content.focus();
  });

  cancelBtn.addEventListener('click', function () {
    dialog.close();
  });

  content.addEventListener('input', function () {
    count.textContent = content.value.length + '/500';
  });

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    var text = content.value.trim();
    if (!text) {
      msg.textContent = '内容不能为空';
      msg.className = 'fb-msg fb-msg-err';
      return;
    }
    submitBtn.disabled = true;
    try {
      var resp = await fetch('/feedback', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          content: text,
          contact: contact.value.trim(),
          page: location.pathname
        })
      });
      var data = {};
      try { data = await resp.json(); } catch (e) {}
      if (resp.ok && data.ok) {
        msg.textContent = '已收到，谢谢！';
        msg.className = 'fb-msg fb-msg-ok';
        closeTimer = setTimeout(function () { dialog.close(); }, 1500);
      } else {
        msg.textContent = data.message || '提交失败，请稍后再试';
        msg.className = 'fb-msg fb-msg-err';
      }
    } catch (e) {
      msg.textContent = '网络异常，请稍后再试';
      msg.className = 'fb-msg fb-msg-err';
    }
    submitBtn.disabled = false;
  });

  dialog.addEventListener('close', function () {
    if (closeTimer) {
      clearTimeout(closeTimer);
      closeTimer = null;
    }
    form.reset();
    count.textContent = '0/500';
    msg.textContent = '';
    msg.className = 'fb-msg';
  });
})();
</script>
</body>
</html>
