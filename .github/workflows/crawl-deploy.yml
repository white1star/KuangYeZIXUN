name: 抓取并部署静态站

on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: crawl-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  crawl-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 从 data 分支恢复数据库
        run: |
          mkdir -p data logs
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show origin/data:data/news.db > data/news.db
            echo "已从 data 分支恢复数据库（$(du -h data/news.db | cut -f1)）"
          else
            echo "data 分支尚不存在，本次使用空库"
          fi
      - name: 抓取一轮
        run: python -m crawler.main --once
      - name: 静态化构建
        run: python -m scripts.build_site
      - name: 回写数据库到 data 分支（单提交强推）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/news.db "$RUNNER_TEMP/news.db"
          git checkout --orphan data-tmp
          git rm -rf --cached . > /dev/null
          cp "$RUNNER_TEMP/news.db" data/news.db
          git add -f data/news.db
          git commit -m "data: 数据快照 $(date +'%Y-%m-%d %H:%M')"
          git push -f origin data-tmp:data
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上传静态产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
